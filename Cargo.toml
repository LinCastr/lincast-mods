[package]
name = "linex-mods"
version = "0.1.0"
edition = "2024"
description = "modding manager vibecoded that works like Vortex mod manager because i'm lazy to mod on linux"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
