[package]
name = "linex-mods"
version = "0.1.0"
edition = "2024"
description = "modding manager vibecoded that works like Vortex mod manager because i'm lazy to mod on linux"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-femtovg", "image-default-formats", "unstable-winit-030"] }
rfd = "0.15"
trash = "5"
notify-rust = "4"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
